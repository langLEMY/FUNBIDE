<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-funbide.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FUNBIDE — Panel administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var temaGuardado = window.localStorage.getItem('funbide-tema')
        document.documentElement.setAttribute('data-theme', temaGuardado === 'claro' ? 'claro' : 'oscuro')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
